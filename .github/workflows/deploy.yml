name: Deploy Django to Cloud Run

on:
  push:
    branches:
      - main
      - cloudRun

env:
  SERVICE: django-app
  REPO: django-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        export_default_credentials: true

    # Build Docker image 並 push 到 GCR
    - name: Build and push Docker image
      run: |
        IMAGE_NAME=gcr.io/${{ secrets.GCP_PROJECT_ID }}/django-app:latest
        gcloud builds submit \
        --tag $IMAGE_NAME \
        --quiet \
        --async
    
    # 一次性jobs套件
    - name: Install gcloud beta
      run: gcloud components install beta --quiet

    # 執行 migrate（使用 Cloud Run Jobs）
    - name: Run Django Migrations
      run: |
        IMAGE_NAME=gcr.io/${{ secrets.GCP_PROJECT_ID }}/django-app:latest
        # 建立 Cloud Run Job（只需第一次，之後可以重複執行）
        gcloud beta run jobs update django-migrate-job \
          --image $IMAGE_NAME \
          --vpc-connector ${{ secrets.GCP_CONNECTOR_NAME }} \
          --region ${{ secrets.GCP_REGION }} \
          --set-env-vars "DB_SERVER=${{ vars.DB_SERVER }},SECRET_KEY=${{ secrets.SECRET_KEY }},POSTGRESQL_DB_NAME=${{ secrets.POSTGRESQL_DB_NAME }},POSTGRESQL_DB_USER=${{ secrets.POSTGRESQL_DB_USER }},POSTGRESQL_DB_PASSWORD=${{ secrets.POSTGRESQL_DB_PASSWORD }},POSTGRESQL_DB_HOST=${{ secrets.POSTGRESQL_DB_HOST }},POSTGRESQL_DB_PORT=${{ secrets.POSTGRESQL_DB_PORT }}" \
          --tasks 1 \
          --command "python manage.py migrate" \
          --memory 512Mi \
          --quiet || \
        gcloud beta run jobs create django-migrate-job \
          --image $IMAGE_NAME \
          --vpc-connector ${{ secrets.GCP_CONNECTOR_NAME }} \
          --region ${{ secrets.GCP_REGION }} \
          --set-env-vars "DB_SERVER=${{ vars.DB_SERVER }},SECRET_KEY=${{ secrets.SECRET_KEY }},POSTGRESQL_DB_NAME=${{ secrets.POSTGRESQL_DB_NAME }},POSTGRESQL_DB_USER=${{ secrets.POSTGRESQL_DB_USER }},POSTGRESQL_DB_PASSWORD=${{ secrets.POSTGRESQL_DB_PASSWORD }},POSTGRESQL_DB_HOST=${{ secrets.POSTGRESQL_DB_HOST }},POSTGRESQL_DB_PORT=${{ secrets.POSTGRESQL_DB_PORT }}" \
          --tasks 1 \
          --command "python manage.py migrate" \
          --memory 512Mi \
          --quiet

    # 部署到 Cloud Run
    - name: Deploy to Cloud Run
      run: |
        IMAGE_NAME=gcr.io/${{ secrets.GCP_PROJECT_ID }}/django-app:latest
        gcloud run deploy django-app \
          --image $IMAGE_NAME \
          --vpc-connector ${{ secrets.GCP_CONNECTOR_NAME}} \
          --region ${{ secrets.GCP_REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars "DB_SERVER=${{ vars.DB_SERVER }},SECRET_KEY=${{ secrets.SECRET_KEY }},POSTGRESQL_DB_NAME=${{ secrets.POSTGRESQL_DB_NAME }},POSTGRESQL_DB_USER=${{ secrets.POSTGRESQL_DB_USER }},POSTGRESQL_DB_PASSWORD=${{ secrets.POSTGRESQL_DB_PASSWORD }},POSTGRESQL_DB_HOST=${{ secrets.POSTGRESQL_DB_HOST }},POSTGRESQL_DB_PORT=${{ secrets.POSTGRESQL_DB_PORT }}"